[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dijaview"
version = "0.1.0"
description = "A privacy-first, local search engine for your computer activity powered by Gemma 2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "icedmist", email = "talk2icedmist@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Icedmist/dijaview"
Repository = "https://github.com/Icedmist/dijaview.git"
Issues = "https://github.com/Icedmist/dijaview/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.scripts]
dijaview = "dijaview.cli:main"

[tool.setuptools.packages.find]
include = ["dijaview*"]
exclude = ["tests*"]
